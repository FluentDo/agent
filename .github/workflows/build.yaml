name: Branch Build and Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**
env:
  # Set once from repo variable or override here for testing
  STEP_SECURITY_EGRESS_POLICY: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}
  # Runner labels - override via repo variables to switch runner pools without workflow changes
  LINUX_AMD_RUNNER: ${{ vars.LINUX_AMD_RUNNER || 'namespace-profile-ubuntu-latest' }}
  LINUX_AMD_LARGE_RUNNER: ${{ vars.LINUX_AMD_LARGE_RUNNER || 'namespace-profile-ubuntu-latest-4cpu-16gb' }}
  LINUX_ARM_RUNNER: ${{ vars.LINUX_ARM_RUNNER || 'namespace-profile-ubuntu-latest-arm' }}

# Default to least permissions and then we can add as needed for each job.
# This is a secure by default approach and also makes it easier to reason
# about permissions for each job since they are not implicit from the workflow
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  get-meta:
    name: Get meta information required for the build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      date: ${{ steps.set-date.outputs.date }}
      linux-targets: ${{ steps.set-meta.outputs.main-linux-targets }}
      version: ${{ steps.set-version.outputs.version }}
      oss-version: ${{ steps.set-oss-version.outputs.oss-version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Debug
        uses: raven-actions/debug@9dbdeb7eea607a7d73411895c65987e71d59a466 # v1.2.0

      - name: Get current date for nightly build info
        id: set-date
        run: |
          echo "date=$(date '+%Y-%m-%d-%H_%M_%S')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Get the versions to use
        # Look for the default line in the Dockerfile
        id: set-version
        run: |
          # Support LTS version for backwards compatibility, but default to the new version variable
          if grep -q "ARG TELEMETRY_FORGE_AGENT_VERSION=" Dockerfile.ubi; then
              echo "Found TELEMETRY_FORGE_AGENT_VERSION in Dockerfile.ubi"
              VERSION=$(grep "ARG TELEMETRY_FORGE_AGENT_VERSION=" Dockerfile.ubi | cut -d '=' -s -f 2 -)
          else
              echo "Could not find TELEMETRY_FORGE_AGENT_VERSION in Dockerfile.ubi, attempting legacy version check for backwards compatibility"
              VERSION=$(grep "ARG FLUENTDO_AGENT_VERSION=" Dockerfile.ubi | cut -d '=' -s -f 2 -)
          fi

          echo "Using version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Extract the configuration from the JSON file
        # Read from the file and remove newline characters: https://stackoverflow.com/a/64627966
        id: set-meta
        run: |
          MAIN_LINUX_TARGETS=$(cat "$JSON_FILE_NAME"|jq -c .release.linux_targets )
          echo "main-linux-targets=$MAIN_LINUX_TARGETS"
          echo "main-linux-targets=$MAIN_LINUX_TARGETS" >> $GITHUB_OUTPUT
        shell: bash
        env:
          JSON_FILE_NAME: build-config.json

      - name: Get the OSS version
        # Read from the file and remove newline characters: https://stackoverflow.com/a/64627966
        id: set-oss-version
        run: |
          OSS_VERSION=$(cat source/oss_version.txt)
          echo "oss-version=$OSS_VERSION"
          echo "oss-version=$OSS_VERSION" >> $GITHUB_OUTPUT
        shell: bash

  build-image:
    uses: ./.github/workflows/call-build-containers.yaml
    needs:
      - get-meta
    strategy:
      fail-fast: false
      matrix:
        image-base:
          - "ghcr.io/telemetryforge/agent/ubi"
          - "ghcr.io/telemetryforge/agent/debian"
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      image-base: ${{ matrix.image-base }}
      # Pick the Dockerfile to use for each image
      definition: ${{ (contains(matrix.image-base, 'debian') && 'Dockerfile.debian') || 'Dockerfile.ubi' }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      amd-runner-label: ${{ env.LINUX_AMD_RUNNER }}
      # No self-hosted ARM runners yet so always use the standard ones
      # arm-runner-label: ${{ env.LINUX_ARM_RUNNER }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
      cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      cosign_private_key_password: ${{ secrets.COSIGN_PASSWORD }}

  build-linux:
    uses: ./.github/workflows/call-build-linux-packages.yaml
    needs:
      - get-meta
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      target-matrix: ${{ needs.get-meta.outputs.linux-targets }}
      nightly-build-info: ${{ needs.get-meta.outputs.date }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      amd-runner-label: ${{ env.LINUX_AMD_RUNNER }}
      large-amd-runner-label: ${{ env.LINUX_AMD_LARGE_RUNNER }}
      # No self-hosted ARM runners yet so always use the standard ones
      # arm-runner-label: ${{ env.LINUX_ARM_RUNNER }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}

  build-windows:
    uses: ./.github/workflows/call-build-windows-packages.yaml
    needs:
      - get-meta
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      nightly-build-info: ${{ needs.get-meta.outputs.date }}

  build-macos:
    # Disabled for now for cost reasons, but can be re-enabled if we need to build for macOS
    if: false
    uses: ./.github/workflows/call-build-macos-packages.yaml
    needs:
      - get-meta
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      nightly-build-info: ${{ needs.get-meta.outputs.date }}

  test-containers:
    name: Test container images
    uses: ./.github/workflows/call-test-containers.yaml
    with:
      image: ${{ matrix.image-base }}
      image-tag: ${{ needs.build-image.outputs.version }}
      ref: ${{ github.ref }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build-image
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image-base:
          - "ghcr.io/telemetryforge/agent/ubi"
          - "ghcr.io/telemetryforge/agent/debian"

  test-packages:
    name: Test packages
    needs:
      - get-meta
      - build-linux
    uses: ./.github/workflows/call-test-packages.yaml
    with:
      build-matrix: ${{ needs.get-meta.outputs.linux-targets }}
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      amd-runner-label: ${{ env.LINUX_AMD_RUNNER }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # Staging upload: signs packages and uploads to GCS staging for every commit on main/release branches.
  # The actual GitHub release is only created for version tags (handled by release-build.yaml).
  staging-upload:
    name: Sign and upload staging artefacts
    needs:
      - get-meta
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sign packages
        # Ignore any failures so we upload anything we do have
        continue-on-error: true
        uses: ./.github/actions/sign-packages

      - name: Upload packages to Google Cloud Storage
        id: upload-packages
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: output/
          # We still use the old buckets from before our rename
          destination: fluentdo-agent-staging/${{ needs.get-meta.outputs.version }}/
