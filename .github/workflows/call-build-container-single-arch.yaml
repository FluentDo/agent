---
name: Build container for single architecture
on:
  workflow_call:
    inputs:
      version:
        description: The version we are building for (as a numeric value 1.2.3).
        required: true
        type: string
      ref:
        description: The commit, SHA or branch to use in this repository.
        required: false
        type: string
        default: main
      image-base:
        description: The base name to use for images.
        required: false
        type: string
        default: "ghcr.io/telemetryforge/agent"
      definition:
        description: The Dockerfile definition to use.
        required: false
        type: string
        default: "Dockerfile.ubi"
      dockerhub-username:
        description: The Dockerhub username to use for authenticated pulls.
        required: false
        type: string
        default: "telemetryforge"
      platform:
        description: The platform to build for (e.g. amd64, arm64, s390x).
        required: true
        type: string
      amd-runner-label:
        description: The label to use for AMD64 runner.
        required: false
        type: string
        default: "namespace-profile-ubuntu-latest"
      arm-runner-label:
        description: The label to use for ARM64 runner.
        required: false
        type: string
        default: "namespace-profile-ubuntu-latest-arm"
      s390x-runner-label:
        description: The label to use for s390x runner.
        required: false
        type: string
        default: "ubuntu-24.04-s390x"
      nightly-build-info:
        description: Any special information to add to the nightly build information string.
        required: false
        type: string
        default: ""
    secrets:
      dockerhub-token:
        description: The Dockerhub token to use for authenticated pulls (not pushes).
        required: true
    outputs:
      digest:
        description: The digest of the production image.
        value: ${{ jobs.build-single-arch.outputs.digest }}

env:
  STEP_SECURITY_EGRESS_POLICY: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}

permissions:
  contents: read

jobs:
  build-single-arch:
    permissions:
      contents: read
      packages: write
    name: ${{ inputs.platform }}/production container image build
    runs-on: ${{ (contains(inputs.platform, 'arm') && inputs.arm-runner-label) || (contains(inputs.platform, 's390x') && inputs.s390x-runner-label) || inputs.amd-runner-label }}
    outputs:
      digest: ${{ steps.production.outputs.digest }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: telemetryforge/agent
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Ensure we apply specific version from tag
        run: ./scripts/setup-code.sh
        shell: bash
        env:
          TELEMETRY_FORGE_AGENT_VERSION: ${{ inputs.version }}

      - name: Deltas
        run: git diff
        shell: bash

      # Must be removed on Namespace runners
      - name: Set up QEMU
        if: ${{ !(contains( runner.name, 'nsc-' ) || contains( inputs.platform, 's390x' )) }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        if: ${{ !contains( runner.name, 'nsc-' ) }}
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to docker.io for authorised pulls
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Used to set default labels and the like to overwrite base image ones
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          labels: |
            build-date={{date 'YYYYMMDD-HHmmss'}}
            version=${{ inputs.version }}
            io.k8s.description=Telemetry Forge Agent is a stable, secure by default, OSS (Apache-licensed) downstream distribution of Fluent Bit with predictable releases and long-term supported versions for 24 months.
            io.k8s.display-name=Telemetry Forge Agent
            io.openshift.tags=observability,logging,log-aggregation,telemetryforge,fluent-bit
            url=https://telemetryforge.io
            vendor=Telemetry Forge at https://telemetryforge.io
            maintainer=Telemetry Forge via info@telemetryforge.io
            name=Telemetry Forge Agent
            description=Telemetry Forge Agent is a stable, secure by default, OSS (Apache-licensed) downstream distribution of Fluent Bit with predictable releases and long-term supported versions for 24 months.
            summary=Telemetry Forge Agent is an Enterprise hardened version of Fluent Bit

      - name: Build and push by digest the production image
        id: production
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ inputs.definition }}
          outputs: type=image,name=${{ inputs.image-base }},push-by-digest=true,name-canonical=true,push=true
          platforms: linux/${{ inputs.platform }}
          target: production
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TELEMETRY_FORGE_AGENT_VERSION=${{ inputs.version }}
            FLUENTDO_AGENT_VERSION=${{ inputs.version }}
            FLB_NIGHTLY_BUILD=${{ inputs.nightly-build-info }}
          provenance: false

      - name: Export production digest
        run: |
          mkdir -p digests
          digest="${{ steps.production.outputs.digest }}"
          touch "digests/${digest#sha256:}"
        shell: bash

      - name: Create sanitised name for artefact
        run: |
          sanitised_image_base=$(echo "${{ inputs.image-base }}" | tr '/:' '__')
          echo "sanitised_image_base=${sanitised_image_base}"
          echo "sanitised_image_base=${sanitised_image_base}" >> $GITHUB_OUTPUT
        id: output-name
        shell: bash

      - name: Upload production digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-digests-${{ steps.output-name.outputs.sanitised_image_base }}-${{ inputs.platform }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Extract metadata from Github for test image
        if: inputs.platform == 'amd64'
        id: meta-test
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ inputs.image-base }}/test
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},event=tag
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push the test image
        if: inputs.platform == 'amd64'
        id: test
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ inputs.definition }}
          platforms: linux/amd64
          target: test
          build-args: |
            TELEMETRY_FORGE_AGENT_VERSION=${{ inputs.version }}
            FLUENTDO_AGENT_VERSION=${{ inputs.version }}
            FLB_NIGHTLY_BUILD=${{ inputs.nightly-build-info }}
          provenance: false
          push: true
          tags: ${{ steps.meta-test.outputs.tags }}
          labels: ${{ steps.meta-test.outputs.labels }}
