name: PR Build and Test
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
env:
  # Set once from repo variable or override here for testing
  STEP_SECURITY_EGRESS_POLICY: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}

# Default to least permissions and then we can add as needed for each job.
# This is a secure by default approach and also makes it easier to reason
# about permissions for each job since they are not implicit from the workflow
permissions: read-all

# Cancel any running jobs for PRs on a new commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  get-meta:
    name: Get meta information required for the build
    uses: ./.github/workflows/call-get-metadata.yaml
    with:
      ref: ${{ github.ref }}
      get-version-from-tag: false
      use-full-linux-targets: true

  build-image:
    uses: ./.github/workflows/call-build-containers.yaml
    needs:
      - get-meta
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      platforms: '["amd64"]'
      nightly-build-info: ${{ needs.get-meta.outputs.date }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
      cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      cosign_private_key_password: ${{ secrets.COSIGN_PASSWORD }}

  build-linux:
    # Only build Linux packages if we have a label set
    if: ${{ contains(github.event.pull_request.labels.*.name, 'build-packages') || contains(github.event.pull_request.labels.*.name, 'build-linux') }}
    uses: ./.github/workflows/call-build-linux-packages.yaml
    needs:
      - get-meta
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      target-matrix: ${{ needs.get-meta.outputs.linux-targets }}
      nightly-build-info: ${{ needs.get-meta.outputs.date }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}

  build-windows:
    # Only build Windows packages if we have a label set
    if: ${{ contains(github.event.pull_request.labels.*.name, 'build-packages') || contains(github.event.pull_request.labels.*.name, 'build-windows') }}
    uses: ./.github/workflows/call-build-windows-packages.yaml
    needs:
      - get-meta
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      nightly-build-info: ${{ needs.get-meta.outputs.date }}

  build-macos:
    # Only build macOS packages with the label to reduce unnecessary CI costs
    if: ${{ contains(github.event.pull_request.labels.*.name, 'build-packages') || contains(github.event.pull_request.labels.*.name, 'build-macos') }}
    uses: ./.github/workflows/call-build-macos-packages.yaml
    needs:
      - get-meta
    with:
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      nightly-build-info: ${{ needs.get-meta.outputs.date }}

  test-containers:
    name: Test container images
    uses: ./.github/workflows/call-test-containers.yaml
    with:
      image: ${{ matrix.image-base }}
      image-tag: ${{ needs.build-image.outputs.version }}
      ref: ${{ github.ref }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build-image
      - get-meta
    permissions:
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image-base:
          - ${{ needs.get-meta.outputs.ubi-image-base }}
          - ${{ needs.get-meta.outputs.debian-image-base }}

  test-packages:
    name: Test packages
    needs:
      - get-meta
      - build-linux
    uses: ./.github/workflows/call-test-packages.yaml
    with:
      build-matrix: ${{ needs.get-meta.outputs.linux-targets }}
      version: ${{ needs.get-meta.outputs.version }}
      ref: ${{ github.ref }}
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUBLIC_READ_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # Placeholder to make it simple to create a status check on this, do not change name.
  # Instead of modifying branch protection rules every time we add a new job, we just
  # add it as a dependency of this job.
  # This job must always run last so it depends on all other jobs that must complete.
  # Note that jobs that are conditionally run (e.g. not on PRs) must be excluded here.
  # If you add a new job that must complete then add it here.
  tests-complete:
    name: All tests complete
    # We use this to always run even if a previous job fails or is skipped (which we check for)
    if: always()
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-image
      - test-containers
      # TODO: remove once failures are resolved to ensure auto-release job still goes ahead with latest commit
      # https://github.com/telemetryforge/agent/issues/73
      # - test-packages
      # Add additional jobs here as required that must complete
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          # Add any jobs that can be skipped here to avoid failure of this job
          allowed-skips: build-linux,build-windows,build-macos,test-packages
          # Convert the needs object to JSON to pass it in
          jobs: ${{ toJSON(needs) }}
      - name: All tests complete
        run: echo "All tests complete"
        shell: bash
