---
name: Build containers
on:
  workflow_call:
    inputs:
      version:
        description: The version we are building for (as a numeric value 1.2.3).
        required: true
        type: string
      ref:
        description: The commit, SHA or branch to use in this repository.
        required: false
        type: string
        default: main
      dockerhub-username:
        description: The Dockerhub username to use for authenticated pulls.
        required: false
        type: string
        default: "telemetryforge"
      amd-runner-label:
        description: The label to use for the runner (if not specified then the default ubuntu-latest or equivalent is used).
        required: false
        type: string
        default: "namespace-profile-ubuntu-latest"
      arm-runner-label:
        description: The label to use for the runner (if not specified then the default ubuntu-latest or equivalent is used).
        required: false
        type: string
        default: "namespace-profile-ubuntu-latest-arm"
      s390x-runner-label:
        description: The label to use for the runner (if not specified then the default ubuntu-latest or equivalent is used).
        required: false
        type: string
        default: "ubuntu-24.04-s390x"
      nightly-build-info:
        description: Any special information to add to the nightly build information string.
        required: false
        type: string
        default: ""
      platforms:
        description: JSON array of platforms to build (e.g. '["amd64"]' or '["amd64", "arm64", "s390x"]').
        required: false
        type: string
        default: '["amd64", "arm64", "s390x"]'
    secrets:
      cosign_private_key:
        description: The optional Cosign key to use for signing the images.
        required: false
      cosign_private_key_password:
        description: If the Cosign key requires a password then specify here, otherwise not required.
        required: false
      dockerhub-token:
        description: The Dockerhub token to use for authenticated pulls (not pushes).
        required: true
    outputs:
      tag:
        description: The full image name and tag.
        value: ${{ jobs.build-container-image-manifest.outputs.tag }}
      version:
        description: Just the container version (tag)
        value: ${{ jobs.build-container-image-manifest.outputs.version }}

env:
  # Set once from repo variable or override here for testing
  STEP_SECURITY_EGRESS_POLICY: ${{ vars.STEP_SECURITY_EGRESS_POLICY || 'audit' }}

permissions:
  contents: read

jobs:
  build-single-arch-container-images:
    strategy:
      fail-fast: false
      matrix:
        image-base:
          - "ghcr.io/telemetryforge/agent/ubi"
          - "ghcr.io/telemetryforge/agent/debian"
        platform: ${{ fromJson(inputs.platforms) }}
    uses: ./.github/workflows/call-build-container-single-arch.yaml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      image-base: ${{ matrix.image-base }}
      definition: ${{ (contains(matrix.image-base, 'debian') && 'Dockerfile.debian') || 'Dockerfile.ubi' }}
      dockerhub-username: ${{ inputs.dockerhub-username }}
      platform: ${{ matrix.platform }}
      amd-runner-label: ${{ inputs.amd-runner-label }}
      arm-runner-label: ${{ inputs.arm-runner-label }}
      s390x-runner-label: ${{ inputs.s390x-runner-label }}
      nightly-build-info: ${{ inputs.nightly-build-info }}
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-token }}

  # Take the digests and produce a multi-arch manifest from them.
  build-container-image-manifest:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image-base:
          - "ghcr.io/telemetryforge/agent/ubi"
          - "ghcr.io/telemetryforge/agent/debian"
    name: Upload multi-arch container image manifests - ${{ matrix.image-base }}
    runs-on: ubuntu-latest
    needs:
      - build-single-arch-container-images
    outputs:
      tag: ${{ matrix.image-base }}:${{ steps.meta.outputs.version }}
      image: ${{ matrix.image-base }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Extract metadata from Github
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ matrix.image-base }}
          flavor: |
            latest=false
          tags: |
            # Ensure we strip the 'v' prefix
            type=semver,pattern={{version}},event=tag
            # defaults for others
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Create sanitised name for artefact
        run: |
          sanitised_image_base=$(echo "${{ matrix.image-base }}" | tr '/:' '__')
          echo "sanitised_image_base=${sanitised_image_base}"
          echo "sanitised_image_base=${sanitised_image_base}" >> $GITHUB_OUTPUT
        id: output-name
        shell: bash

      - name: Download digests for all architectures of ${{ steps.output-name.outputs.sanitised_image_base }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: production-digests-${{ steps.output-name.outputs.sanitised_image_base }}-*
          path: digests/
          merge-multiple: true

      - name: Debug
        run: ls -lR
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create production manifest
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ matrix.image-base }}@sha256:%s ' *)
        shell: bash
        working-directory: digests/

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ matrix.image-base }}:${{ steps.meta.outputs.version }}
        shell: bash

  build-container-images-sign:
    strategy:
      fail-fast: false
      matrix:
        image-base:
          - "ghcr.io/telemetryforge/agent/ubi"
          - "ghcr.io/telemetryforge/agent/debian"
    name: Deploy and sign multi-arch container image manifests - ${{ matrix.image-base }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    runs-on: ubuntu-latest
    needs:
      - build-container-image-manifest
    env:
      IMAGE: ${{ needs.build-container-image-manifest.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ env.STEP_SECURITY_EGRESS_POLICY }}

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with a key if defined
        if: ${{ env.COSIGN_PRIVATE_KEY }}
        # Ensure we move on to OIDC signing as well
        continue-on-error: true
        run: |
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
          COSIGN_PASSWORD: ${{ secrets.cosign_private_key_password }} # optional
        shell: bash

      - name: Sign the images with GitHub OIDC Token
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance, and records it to the
        # sigstore community Rekor transparency log.
        #
        # We use recursive signing on the manifest to cover all the images.
        continue-on-error: true
        run: |
          cosign sign --yes --recursive "$IMAGE"
        shell: bash
