version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    groups:
      docker:
        patterns:
          - "*"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
