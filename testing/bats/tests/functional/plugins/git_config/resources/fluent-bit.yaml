service:
  flush: 1
  grace: 1
  log_level: info

pipeline:
  inputs:
    - name: dummy
      dummy: '{"message": "Switched to updated configuration"}'
      alias: input_dummy

  outputs:
    - name: stdout
      match: '*'
      alias: output_stdout
    - name: exit
      match: '*'
      # Exit after processing 5 records to ensure the test completes in a reasonable time frame
      record_count: 5
      alias: output_exit