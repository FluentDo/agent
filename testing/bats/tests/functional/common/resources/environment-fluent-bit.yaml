service:
  flush: 1
  grace: 1
  log_level: info

pipeline:
  inputs:
    - name: dummy
      # We use the environment variables to verify that they are set correctly based on the build and packaging configuration of the agent.
      dummy: '{"distro": "${AGENT_DISTRO}", "package_type": "${AGENT_PACKAGE_TYPE}", "version": "${AGENT_VERSION}", "os": "${OS_TYPE}"}'
      alias: input_dummy

  outputs:
    - name: stdout
      match: '*'
      alias: output_stdout
    - name: exit
      match: '*'
      # Exit after processing 2 records to ensure the test completes in a reasonable time frame
      record_count: 2
      alias: output_exit
